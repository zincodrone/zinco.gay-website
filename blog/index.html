<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="../images/star_blink.gif">
    <style>
        html { background: #000; color: #fff; color-scheme: dark; }
        body { margin: 0; background: #000 url("../images/star_blink.gif") center / cover; }
    </style>
    <script>
        (() => {
            const root = document.documentElement;
            try {
                const key = "zinco:page-entrance:blog";
                if (!sessionStorage.getItem(key)) {
                    sessionStorage.setItem(key, "seen");
                    root.classList.add("page-entrance");
                }
            } catch (_) {
                // Keep content visible if session storage is unavailable.
            }
            window.addEventListener("pagehide", () => root.classList.remove("page-entrance"));
            window.addEventListener("pageshow", (event) => {
                if (event.persisted) root.classList.remove("page-entrance");
            });
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thoughts, updates, and writing from ZINCO.">
    <title>Blog | ZINCO</title>
    <link rel="icon" href="../images/favicon.ico">
    <link rel="stylesheet" href="../style.css?v=1.3.0.6">
</head>
<body class="blog-page">
    <main>
        <h1 class="site-title">BLOG</h1>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/blog/" aria-current="page">Blog</a>
            <a href="/socials">Socials</a>
        </nav>
        <section class="blog-content" aria-labelledby="posts-heading">
            <header class="blog-intro">
                <h2 id="posts-heading">Thoughts from ZINCO</h2>
                <p>A little space for thoughts, updates, and things worth writing down.</p>
            </header>
            <article class="post-card">
                <p class="post-date"><time datetime="2026-10-20">October 20, 2026</time></p>
                <h3><a href="/blog/welcome">Welcome!</a></h3>
                <p>The blog is finally here.</p>
                <a class="read-post" href="/blog/welcome">Read post <span aria-hidden="true">→</span></a>
            </article>
        </section>
    </main>
    <footer class="site-footer">
        <a class="site-version" href="https://github.com/zincodrone/zinco.gay-website">v1.3.0.6</a>
        <p class="footer-heart">🖤</p>
    </footer>
</body>
</html>

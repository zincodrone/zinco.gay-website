name: One-time privacy cleanup

on:
  push:
    branches: [main]
    paths: [.github/workflows/privacy-cleanup.yml]

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[privacy-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    outputs:
      sanitized_head: ${{ steps.prepare.outputs.sanitized_head }}
      original_head: ${{ steps.prepare.outputs.original_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned history-cleanup tool
        run: python3 -m pip install git-filter-repo==2.47.0
      - name: Prepare and audit sanitized history
        id: prepare
        env:
          CLEANUP_PHASE: prepare
          GH_TOKEN: ${{ github.token }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python3 .github/scripts/privacy_cleanup.py

  activate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Refresh deployment and delete old deployment logs
        env:
          CLEANUP_PHASE: activate
          ORIGINAL_HEAD: ${{ needs.prepare.outputs.original_head }}
          SANITIZED_HEAD: ${{ needs.prepare.outputs.sanitized_head }}
          GH_TOKEN: ${{ github.token }}
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_REPOSITORY_ROOT: ${{ secrets.CPANEL_REPOSITORY_ROOT }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
        run: python3 .github/scripts/privacy_cleanup.py

name: Deploy website to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpanel-production
  cancel-in-progress: false

jobs:
  security:
    name: BetterLeaks before deployment
    uses: ./.github/workflows/security-scan.yml

  deploy:
    needs: security
    if: github.ref == 'refs/heads/main' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Update and deploy through cPanel
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_REPOSITORY_ROOT: ${{ format('{0}-clean-history', secrets.CPANEL_REPOSITORY_ROOT) }}
          CPANEL_API_TOKEN: ${{ secrets.CPANEL_API_TOKEN }}
          CLOUDFLARE_WEB_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python3 .github/scripts/deploy_cpanel.py

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="images/star_blink.gif">
    <style>
        html { background: #000; color: #fff; color-scheme: dark; }
        body { margin: 0; background: #000 url("images/star_blink.gif") center / cover; }
    </style>
    <script>
        (() => {
            const root = document.documentElement;
            try {
                const key = "zinco:page-entrance:socials";
                if (!sessionStorage.getItem(key)) {
                    sessionStorage.setItem(key, "seen");
                    root.classList.add("page-entrance");
                }
            } catch (_) {
                // Keep content visible if session storage is unavailable.
            }
            const socialKey = "zinco:social-row-entrance:ready-v3";
            let shouldFadeSocials = true;
            try { shouldFadeSocials = !sessionStorage.getItem(socialKey); } catch (_) {}
            if (shouldFadeSocials && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
                root.classList.add("social-row-pending");
                document.addEventListener("DOMContentLoaded", async () => {
                    const images = [...document.querySelectorAll(".social-links img")];
                    // Wait for the artwork, so the fade doesn't finish before it appears.
                    await Promise.all(images.map((image) => image.decode().catch(() => {})));
                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        root.classList.add("social-row-entrance");
                        root.classList.remove("social-row-pending");
                    }));
                    document.querySelector(".social-links a:last-child").addEventListener("animationend", (event) => {
                        if (event.animationName !== "page-fade-in") return;
                        try { sessionStorage.setItem(socialKey, "seen"); } catch (_) {}
                    });
                }, { once: true });
            }
            window.addEventListener("pagehide", () => root.classList.remove("page-entrance", "social-row-entrance", "social-row-pending"));
            window.addEventListener("pageshow", (event) => {
                if (event.persisted) root.classList.remove("page-entrance", "social-row-entrance", "social-row-pending");
            });
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find ZINCO on Discord, TikTok, GitHub, Bluesky, X, YouTube, Twitch, and Instagram.">
    <title>Socials | ZINCO</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css?v=1.3.0.2">
    <script src="social-links.js?v=1.3.0.2" defer></script>
</head>
<body class="socials-page">
    <main>
        <h1 class="site-title">SOCIALS</h1>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/socials" aria-current="page">Socials</a>
        </nav>
        <nav class="social-links" aria-label="Social media">
            <a href="https://discord.com/users/205816662530719744">
                <img src="images/Social Media Link_Discord.svg" alt="Discord">
            </a>
            <a href="https://www.tiktok.com/@zincodron3">
                <img src="images/Social Media Link_TikTok.svg" alt="TikTok">
            </a>
            <a href="https://www.github.com/zincodrone">
                <img src="images/Social Media Link_Github.svg" alt="GitHub">
            </a>
            <a href="https://bsky.app/profile/zinco.gay">
                <img src="images/Social Media Link_Bluesky.svg" alt="Bluesky">
            </a>
            <a href="https://x.com/zincodrone">
                <img src="images/Social Media Link_X.svg" alt="Twitter / X">
            </a>
            <a href="https://www.youtube.com/@Z_NCO">
                <img src="images/Social Media Link_YouTube.svg" alt="YouTube">
            </a>
            <a href="https://www.twitch.tv/zincodrone">
                <img src="images/Social Media Link_Twitch.svg" alt="Twitch">
            </a>
            <a href="https://www.instagram.com/zincodrone/">
                <img src="images/Social Media Link_Instagram.svg" alt="Instagram">
            </a>
        </nav>
    <div class="choice-reveal" id="social-choice" hidden>
    <section class="link-panel" aria-labelledby="choice-title" aria-describedby="choice-description">
        <h2 id="choice-title" tabindex="-1">Open social profile</h2>
        <p id="choice-description"></p>
        <div class="link-actions">
            <button type="button" id="open-current">Current tab</button>
            <button type="button" id="open-new">New tab</button>
            <button type="button" id="cancel-choice">Cancel</button>
        </div>
    </section>
    </div>
    </main>
    <footer class="site-footer">
        <a class="site-version" href="https://github.com/zincodrone/zinco.gay-website">v1.3.0.2</a>
        <p class="footer-heart">🖤</p>
    </footer>
</body>
</html>

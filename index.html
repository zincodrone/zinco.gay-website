<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="images/star_blink.gif">
    <style>
        html { background: #000; color: #fff; color-scheme: dark; }
        body { margin: 0; background: #000 url("images/star_blink.gif") center / cover; }
    </style>
    <script>
        (() => {
            const root = document.documentElement;
            try {
                const key = "zinco:page-entrance:home";
                if (!sessionStorage.getItem(key)) {
                    sessionStorage.setItem(key, "seen");
                    root.classList.add("page-entrance");
                }
            } catch (_) {
                // Keep content visible if session storage is unavailable.
            }
            window.addEventListener("pagehide", () => root.classList.remove("page-entrance"));
            window.addEventListener("pageshow", (event) => {
                if (event.persisted) root.classList.remove("page-entrance");
            });
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZINCO</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css?v=1.4.0.0">
</head>
<body class="home-page">
    <main>
        <h1 class="site-title">ZINCO</h1>
        <nav class="site-nav" aria-label="Main navigation">
            <a href="/" aria-current="page">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/socials">Socials</a>
        </nav>

        <section class="bio" aria-labelledby="bio-heading">
            <h2 id="bio-heading">
                Greetings, I'm <span class="bio-name">ZINCO <span class="bio-pronouns">(he/they)</span></span>
                and welcome to my website.
            </h2>
            <p>
                Find me on my <a href="/socials">socials</a>, or visit my <a href="/blog/">blog</a>
                for thoughts and updates. There is more to come.
            </p>
        </section>


    </main>

    <footer class="site-footer">
        <a class="site-version" href="https://github.com/zincodrone/zinco.gay-website">v1.4.0.0</a>
        <p class="footer-heart">🖤</p>
    </footer>
    <!-- CLOUDFLARE_WEB_ANALYTICS -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <link rel="preload" as="image" href="images/star_blink.gif">
    <style>
        html { background: #000; color: #fff; color-scheme: dark; }
        body { margin: 0; background: #000 url("images/star_blink.gif") center / cover; }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Leaving ZINCO</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="stylesheet" href="style.css?v=1.3.0">
    <script src="social-links.js?v=1.3.0" defer></script>
</head>
<body>
    <main>
        <nav class="site-nav post-nav" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/blog/">Blog</a>
            <a href="/socials">Socials</a>
        </nav>
        <section class="blog-content post-body" aria-labelledby="redirect-title">
            <h1 id="redirect-title">See you around!</h1>
            <p id="redirect-destination">You're leaving ZINCO's website.</p>
            <p id="redirect-url" class="redirect-url"></p>
            <p id="redirect-status" role="status"></p>
            <div class="link-actions">
                <a id="continue-social" hidden>Continue now</a>
                <a id="cancel-redirect" href="/socials">Cancel and return to Socials</a>
            </div>
            <noscript><p>JavaScript is needed for this redirect. Return to <a href="/socials">Socials</a> and choose your link there.</p></noscript>
        </section>
    </main>
    <footer class="site-footer">
        <a class="site-version" href="https://github.com/zincodrone/zinco.gay-website">v1.3.0</a>
        <p class="footer-heart">🖤</p>
    </footer>
</body>
</html>

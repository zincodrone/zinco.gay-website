---
deployment:
  tasks:
    # Change this path if zinco.gay uses a different document root in cPanel.
    - 'export DEPLOYPATH="$HOME/public_html"'
    - '/usr/bin/test -d "$DEPLOYPATH"'
    - '/bin/cp .htaccess index.html socials.html redirect.html social-links.js style.css "$DEPLOYPATH/"'
    - '/bin/cp -R blog images "$DEPLOYPATH/"'
